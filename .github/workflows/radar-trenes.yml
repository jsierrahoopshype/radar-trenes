name: Radar de trenes

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuantos destinos barrer (3 para validar rapido, 0 = todos)"
        type: string
        default: "3"
      solo_sonda:
        description: "Solo diagnostico, sin barrer precios"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-trenes
  cancel-in-progress: false

jobs:
  barrer:
    runs-on: ubuntu-latest
    timeout-minutes: 50        # dos busquedas por ruta, hace falta margen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cachear el navegador de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # Solo cuando se pide expresamente: en marcha normal es un minuto perdido.
      - name: Sonda de diagnostico
        if: ${{ inputs.solo_sonda == true }}
        continue-on-error: true
        run: python sonda.py

      - name: Barrer Renfe
        id: barrido
        if: ${{ inputs.solo_sonda != true }}
        continue-on-error: true
        env:
          LIMITE: ${{ inputs.limite || '0' }}
        run: python scraper.py

      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar precios-trenes.json
        if: always()
        run: |
          if [ ! -f precios-trenes.json ]; then
            echo "No hay precios-trenes.json que publicar."
            exit 0
          fi
          git config user.name  "radar-trenes"
          git config user.email "radar-trenes@users.noreply.github.com"
          git add precios-trenes.json
          if git diff --staged --quiet; then
            echo "Sin cambios de precio hoy."
          else
            git commit -m "Precios de tren $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Resumen
        if: always()
        run: |
          if [ -f precios-trenes.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open('precios-trenes.json'))
          r = d.get('resumen', {})
          print('### Resultado del barrido\n')
          print(f"- Con precio: **{r.get('con_precio', 0)}**")
          print(f"- Fuera de venta: {r.get('fuera_de_venta', 0)}")
          print(f"- Fallidas: {r.get('fallidas', 0)}")
          print(f"\nAlerta: {d.get('alerta') or 'ninguna'}\n")
          for vid, v in (d.get('ventanas') or {}).items():
              con = [x for x in v['rutas'] if x.get('precio')]
              if not con:
                  continue
              print(f"\n**{vid}** ({v['salida']} a {v['vuelta']})\n")
              print('| Destino | Precio | Referencia | Var. |')
              print('|---|---:|---:|---:|')
              for x in sorted(con, key=lambda a: a['precio']):
                  var = x.get('variacion_pct')
                  print(f"| {x['destino']} | {x['precio']} € | "
                        f"{x.get('referencia') or '-'} | "
                        f"{(str(var) + ' %') if var is not None else '-'} |")
          PY
          fi
