name: Radar de trenes

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      solo_sonda:
        description: "Solo diagnostico (1 min, no barre precios)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-trenes
  cancel-in-progress: false

jobs:
  barrer:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # antes 45 y se los comia enteros fallando

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cachear el navegador de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # Siempre corre. Tarda un minuto y es lo que permite arreglar selectores
      # sin adivinar cuando Renfe cambia el maquetado.
      - name: Sonda de diagnostico
        continue-on-error: true
        run: python sonda.py

      - name: Barrer Renfe
        id: barrido
        if: ${{ inputs.solo_sonda != true }}
        continue-on-error: true
        run: python scraper.py

      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar precios-trenes.json
        if: always()
        run: |
          if [ ! -f precios-trenes.json ]; then
            echo "No hay precios-trenes.json que publicar (la sonda no lo genera)."
            exit 0
          fi
          git config user.name  "radar-trenes"
          git config user.email "radar-trenes@users.noreply.github.com"
          git add precios-trenes.json
          if git diff --staged --quiet; then
            echo "Sin cambios de precio hoy."
          else
            git commit -m "Precios de tren $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Resumen
        if: always()
        run: |
          if [ -f precios-trenes.json ]; then
            echo "### Resultado del barrido" >> $GITHUB_STEP_SUMMARY
            python -c "import json;d=json.load(open('precios-trenes.json'));print('Alerta:', d.get('alerta') or 'ninguna')" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Descarga el artefacto 'diagnostico' si algo ha fallado." >> $GITHUB_STEP_SUMMARY
